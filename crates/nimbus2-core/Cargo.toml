[package]
name = "nimbus2-core"
version = "2.4.0"
edition = "2021"
authors = ["Rasa-X-Machina Engineering <https://trust.rasaxmachina.com>"]
license = "MIT"
description = "Nimbus² v2.4.0 Core Engine — High-performance concurrent proxy, SOFTEM hardware detector, Etamanga authenticated crypto & multiboot verifier"

[[bin]]
name = "nimbus2-engine"
path = "src/main.rs"

[[bin]]
name = "nimbus2-tui"
path = "src/bin/nimbus2-tui.rs"

[dependencies]
blake3 = "1.5"
constant_time_eq = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
